<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperAI Studio</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <div class="brand">
          <img src="./logo.png" alt="SuperAI" class="logo" />
          <div>
            <h1 id="heading">SuperAI Studio</h1>
            <p class="sub" id="version"></p>
          </div>
        </div>
        <button id="refresh" class="btn">刷新</button>
      </header>

      <p id="error" class="error"></p>

      <section class="card">
        <h2 id="status-title">运行状态</h2>
        <div id="features" class="chips"></div>
        <dl id="route-tiers" class="kv"></dl>
      </section>

      <section class="card">
        <h2 id="health-title">模型健康度</h2>
        <ul id="health" class="list"></ul>
      </section>

      <section class="card">
        <h2 id="stats-title">用量统计</h2>
        <div class="metrics" id="stats"></div>
        <div class="bars" id="provider-bars"></div>
        <div class="bars" id="route-bars"></div>
        <div class="bars" id="daily-bars"></div>
      </section>

      <section class="card">
        <h2 id="tools-title">已注册工具</h2>
        <ul id="tools" class="list"></ul>
      </section>

      <section class="card">
        <h2 id="sessions-title">会话列表</h2>
        <ul id="sessions" class="list"></ul>
      </section>

      <section class="card">
        <h2 id="memory-title">记忆查询</h2>
        <div class="row">
          <input id="session" class="input" placeholder="会话 UMO，例如 aiocqhttp:GroupMessage:12345" />
          <input id="query" class="input" placeholder="关键词（可选）" />
          <button id="search" class="btn">检索</button>
          <button id="clear" class="btn danger">清空记忆</button>
        </div>
        <pre id="memory-output" class="pre"></pre>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
