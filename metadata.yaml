name: astrbot_plugin_superai
display_name: SuperAI
short_desc: 新一代 AstrBot AI 增强插件：多模型路由、智能记忆、Agent 与知识库增强。
desc: >
  SuperAI 是面向 AstrBot 的 AI 增强插件。它把「模型路由 / 自动降级」「智能记忆与摘要」
  「联网增强」「知识库问答」「AI 快捷指令」「工作流编排」「用量统计与成本控制」
  打包成一套可视化的 AI 基建，让 Bot 在保持上下文连贯的同时更快、更稳、更省。
