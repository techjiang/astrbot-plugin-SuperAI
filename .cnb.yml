# SuperAI 流水线：代码风格检查 + 单元测试
#
# AstrBot 本体要求 Python >= 3.12，因此这里直接使用 python:3.12 镜像。
# 插件运行依赖（requirements.txt，如 aiohttp）由 AstrBot 内置，
# 但测试环境没有 AstrBot，因此 CI 需显式安装运行依赖 + 测试依赖。

main:
  push:
    - name: lint-and-test
      docker:
        image: python:3.12-slim
      stages:
        - name: 安装依赖
          script: |
            pip install --no-cache-dir -U pip
            pip install --no-cache-dir -r requirements.txt
            pip install --no-cache-dir -r requirements-dev.txt
        - name: 代码风格检查
          script:
            - ruff check .
            - ruff format --check .
        - name: 单元测试
          script:
            - python -m pytest tests
        - name: 真实 AstrBot 端到端联调
          script: |
            # 拉取真实 AstrBot，验证「入口可发现 / 钩子被正确绑定 / 路由生效」
            # 这一步专门守住「测试绿但线上死」的陷阱（单元测试用的是替身）
            git clone --depth 1 https://github.com/AstrBotDevs/AstrBot /tmp/astrbot-ref
            ASTRBOT_REF=/tmp/astrbot-ref python scripts/e2e_smoke.py

  pull_request:
    - name: lint-and-test
      docker:
        image: python:3.12-slim
      stages:
        - name: 安装依赖
          script: |
            pip install --no-cache-dir -U pip
            pip install --no-cache-dir -r requirements.txt
            pip install --no-cache-dir -r requirements-dev.txt
        - name: 代码风格检查
          script:
            - ruff check .
            - ruff format --check .
        - name: 单元测试
          script:
            - python -m pytest tests
        - name: 真实 AstrBot 端到端联调
          script: |
            git clone --depth 1 https://github.com/AstrBotDevs/AstrBot /tmp/astrbot-ref
            ASTRBOT_REF=/tmp/astrbot-ref python scripts/e2e_smoke.py
